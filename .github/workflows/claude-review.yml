name: Claude Code Review

# Automatic PR review by Claude (Haiku), via the official claude-code-action.
# Runs alongside CodeRabbit for now. Unlike CodeRabbit's free tier, this runs
# on every PR regardless of repo stars.
#
# Auth: a Claude subscription OAuth token (no API billing). Generate it once
# locally with `claude setup-token` and add it as the CLAUDE_CODE_OAUTH_TOKEN
# repository secret. The Claude GitHub App must be installed on the repo so
# Claude can post the review (https://github.com/apps/claude).
#
# Note: on public repos, GitHub withholds secrets from fork PRs, so this runs
# only on pull requests from branches in this repository.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --model claude-haiku-4-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # Always leave one visible confirmation comment so it's clear Claude ran,
      # even when the review found nothing to flag. Updated in place each run
      # (not a new comment every time), so it doesn't spam the thread.
      - name: Post review confirmation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- claude-review-confirmation -->"
          BODY="${MARKER}
          🤖 **Claude (Haiku) reviewed this PR.** Any findings appear as inline comments above — no inline comments means nothing was flagged. ([view run](${RUN_URL}))"
          EXISTING=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))][0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -f body="$BODY" >/dev/null
            echo "Updated existing confirmation comment ${EXISTING}."
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$BODY" >/dev/null
            echo "Posted new confirmation comment."
          fi
