name: Message Notifier

# Emails any member who has new unread messages. Runs on a schedule
# (GitHub Actions is free on public repos). Also runnable on demand via the
# "Run workflow" button for testing.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: message-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: .github/message-notifier
        run: npm install --no-audit --no-fund

      - name: Send notifications
        working-directory: .github/message-notifier
        run: node notify-messages.js
        env:
          # Reuses the marketing agent's existing secrets — nothing new to add.
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Defaults to Resend's sandbox sender, which only delivers to your
          # Resend signup address. Verify nohungrypets.co.uk in Resend and set
          # a FROM_EMAIL repo variable (e.g. notifications@nohungrypets.co.uk)
          # to reach all members.
          FROM_EMAIL: ${{ vars.FROM_EMAIL || 'onboarding@resend.dev' }}
