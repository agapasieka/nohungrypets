name: Service Status

# Collects GitHub Actions + Resend status into a Firestore doc
# (_meta/serviceStatus) that the admin-only /platform-health page reads.
# Free (GitHub Actions on public repos). Runs every 6 hours; also on demand.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h, offset off the hour to avoid peak
  workflow_dispatch:

permissions:
  contents: read
  actions: read            # read workflow run history
  security-events: read    # read Dependabot alerts (best-effort)

concurrency:
  group: service-status
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        working-directory: .github/service-status
        run: npm ci --no-audit --no-fund

      - name: Collect status
        working-directory: .github/service-status
        run: node collect.js
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          # Dedicated full-access key for the dashboard (reads the email list).
          # Falls back in collect.js to RESEND_API_KEY if this isn't set.
          RESEND_READ_API_KEY: ${{ secrets.RESEND_READ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REPOSITORY is provided automatically by Actions.
