name: Gitleaks secret scan

# Defense-in-depth against accidentally committed secrets, on top of GitHub's
# native secret scanning + push protection (already enabled — see the
# "GitHub & Firebase Security Hardening" plan entry). Push protection only
# covers secret formats in GitHub's partner program; gitleaks' broader
# regex/entropy rules catch provider keys that aren't (e.g. Google AI Studio,
# Resend). This runs after a push lands rather than blocking it, so it's a
# second layer, not a replacement.
#
# Uses the plain MIT-licensed `gitleaks` binary directly rather than the
# `gitleaks-action` wrapper: that wrapper needs a paid license for
# organization-owned repos (not an issue here, this repo is personal-owned)
# and stops working once GitHub removes Node 20 from hosted runners on
# 2026-09-16 unless it's updated in time. The raw binary has neither
# constraint.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks-scan # status-check name used by branch protection
    permissions:
      contents: read
      security-events: write # to upload results to the Security tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned version + checksum: no unauthenticated "latest" API lookup
      # (which gets rate-limited and broke installs), and the binary is
      # verified before it runs. Bump both values together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan for secrets
        run: |
          ./gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gitleaks-report.sarif
